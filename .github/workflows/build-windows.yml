# Check on every PR/push. Build the NSIS installer only for version tags and
# attach it to a GitHub Release — no Actions artifact storage (quota-free).
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create NTFS ADS fixtures
        shell: pwsh
        run: .\scripts\create-fixtures.ps1

      - name: Check
        run: npm run check

  release:
    name: Windows installer → GitHub Release
    needs: check
    # Only tagged releases ship an installer (no Actions artifacts).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert tag matches package.json (exact or short vX.Y)
        shell: pwsh
        run: |
          function Normalize-Version([string]$v) {
            $t = $v.Trim() -replace '^[vV]', ''
            $nums = @()
            foreach ($part in ($t.Split('.') | Select-Object -First 3)) {
              if ($part -match '^(\d+)') { $nums += [int]$Matches[1] } else { $nums += 0 }
            }
            while ($nums.Count -lt 3) { $nums += 0 }
            return ($nums[0..2] -join '.')
          }

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+(\.\d+)?$') {
            throw "Tag must be vX.Y or vX.Y.Z (e.g. v0.2 or v0.2.15), got: $tag"
          }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagNorm = Normalize-Version $tag
          $pkgNorm = Normalize-Version $pkg
          $isShortTag = $tag -match '^v\d+\.\d+$'
          $tagParts = $tagNorm.Split('.')
          $pkgParts = $pkgNorm.Split('.')
          $exact = $tagNorm -eq $pkgNorm
          $shortLine = $isShortTag -and ($tagParts[0] -eq $pkgParts[0]) -and ($tagParts[1] -eq $pkgParts[1])
          if (-not ($exact -or $shortLine)) {
            throw "package.json version is '$pkg' but tag is '$tag'. Use v$pkgNorm, or short v$($pkgParts[0]).$($pkgParts[1]) for this $(($pkgParts[0])).$(($pkgParts[1])).x line."
          }
          if ($shortLine -and -not $exact) {
            Write-Host "Short tag $tag accepted for package.json $pkg — installer will be MyFileSync-Setup-$pkg.exe"
          } else {
            Write-Host "Version OK: tag $tag matches package.json $pkg"
          }

      - name: Build NSIS installer
        env:
          # No code-signing cert in CI — skip discovery so the build does not hang.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MyFileSync-Setup-*.exe
            release/*.exe.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
